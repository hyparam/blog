<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}Redirecting...{% endif %}</title>
  <link rel="canonical" href="{{ page.redirect_to }}">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to }}">
  {%- if page.title %}
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:url" content="{{ page.redirect_to }}">
  <meta property="og:type" content="article">
  <meta name="twitter:title" content="{{ page.title | escape }}">
  {%- endif %}
  {%- if page.description %}
  <meta name="description" content="{{ page.description | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta name="twitter:description" content="{{ page.description | escape }}">
  {%- endif %}
  {%- if page.image %}
  <meta property="og:image" content="{{ page.image }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ page.image }}">
  {%- endif %}
</head>
<body>
  <p>This page has moved to <a href="{{ page.redirect_to }}">{{ page.redirect_to }}</a>.</p>
</body>
</html>
